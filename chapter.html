<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Viewer - CT at CCL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Premium Navbar -->
    <nav class="premium-nav">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html#home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    <span>CT at CCL</span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#modules">Modules</a></li>
                <li><a href="index.html#games">Unplugged CT Games</a></li>
                <li><a href="index.html#book">Book</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Chapter Viewer Section -->
    <section class="container" style="margin-top: 2rem; margin-bottom: 6rem;">
        
        <!-- Header with Title and Download Button -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
                <a href="index.html#book" class="btn-outline" style="padding: 6px 16px; margin-bottom: 0.5rem; display: inline-block; font-size: 0.9rem;">
                    &larr; Back to Chapters
                </a>
                <h1 id="chapter-title" style="margin: 0; color: var(--text-main); font-size: 2.5rem;">Loading...</h1>
            </div>
            
            <div>
                <a id="chapter-download-btn" href="#" download class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download Chapter
                </a>
            </div>
        </div>
        
        <!-- PDF Embed Container -->
        <div id="chapter-viewer-container" style="width: 100%; height: 85vh; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <!-- The PDF iframe is injected here by app.js -->
        </div>
        
    </section>

    <!-- Scripts -->
    <script src="bookData.js"></script>
    <script src="app.js"></script>
</body>
</html>
